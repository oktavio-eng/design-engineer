<script>
  (function () {
    try {
      var globals = new URLSearchParams(location.search).get("globals") || "";
      var requested = globals.match(/(?:^|;)theme:([^;]+)/);
      var theme = requested ? requested[1] : localStorage.getItem("storybook-theme");
      var dark = theme && theme !== "system"
        ? theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  })();
</script>

<!-- The iPadOS pointer (cursor.mjs) auto-mounts on import; in Storybook the
     module is imported for its paint function only, so the inventory keeps the
     OS cursor and the story lays the states out statically. -->
<script>document.documentElement.dataset.cursorMount = "manual";</script>

<link id="storybook-flat-type" rel="stylesheet" href="/styles/experiments/flat-type.css" disabled>
<script>
  (function () {
    try {
      var globals = new URLSearchParams(location.search).get("globals") || "";
      var requested = globals.match(/(?:^|;)flatType:([^;]+)/);
      var state = requested ? requested[1] : localStorage.getItem("storybook-flat-type");
      if (state === "on") {
        document.getElementById("storybook-flat-type").disabled = false;
      }
    } catch (e) {}
  })();
</script>
